name: Build Double-Pinch WearMouse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Patch WearMouse for double pinch
        shell: python
        run: |
          from pathlib import Path

          controller = Path(
              "app/src/main/java/com/ginkage/wearmouse/input/MouseController.java"
          )
          s = controller.read_text(encoding="utf-8")

          marker = "    /**\n     * Should be called when an RSB event is detected.\n"

          insert = (
              "    /**\n"
              "     * Sends a complete mouse click without a physical screen touch.\n"
              "     */\n"
              "    public void click(boolean leftButton) {\n"
              "        final @MouseButton int button =\n"
              "                leftButton ? MouseButton.LEFT : MouseButton.RIGHT;\n"
              "        sendButtonEvent(button, true);\n"
              "        sendButtonEvent(button, false);\n"
              "    }\n\n"
          )

          if marker not in s:
              raise SystemExit("MouseController insertion point not found")

          s = s.replace(marker, insert + marker, 1)
          controller.write_text(s, encoding="utf-8")

          fragment = Path(
              "app/src/main/java/com/ginkage/wearmouse/ui/input/MouseFragment.java"
          )
          s = fragment.read_text(encoding="utf-8")

          old = "import android.view.ViewGroup;\n"
          new = (
              "import android.view.ViewGroup;\n"
              "import android.view.accessibility.AccessibilityNodeInfo;\n"
          )

          if old not in s:
              raise SystemExit("MouseFragment import point not found")

          s = s.replace(old, new, 1)

          old = "    private FrameLayout mouseHint;\n"
          new = (
              "    private FrameLayout mouseHint;\n"
              "    private View leftButton;\n"
              "    private View rightButton;\n"
          )

          if old not in s:
              raise SystemExit("MouseFragment field point not found")

          s = s.replace(old, new, 1)

          old = (
              "        root.findViewById(R.id.left_button)"
              ".setOnTouchListener(this::onTouchButton);\n"
              "        root.findViewById(R.id.right_button)"
              ".setOnTouchListener(this::onTouchButton);\n"
          )

          new = (
              "        leftButton = root.findViewById(R.id.left_button);\n"
              "        rightButton = root.findViewById(R.id.right_button);\n\n"
              "        leftButton.setOnTouchListener(this::onTouchButton);\n"
              "        rightButton.setOnTouchListener(this::onTouchButton);\n"
              "        leftButton.setOnClickListener(this::onAccessibilityClickButton);\n"
              "        rightButton.setOnClickListener(this::onAccessibilityClickButton);\n"
              "        leftButton.setImportantForAccessibility(\n"
              "                View.IMPORTANT_FOR_ACCESSIBILITY_YES);\n"
              "        rightButton.setImportantForAccessibility(\n"
              "                View.IMPORTANT_FOR_ACCESSIBILITY_YES);\n"
              "        leftButton.setFocusable(true);\n"
              "        rightButton.setFocusable(true);\n"
          )

          if old not in s:
              raise SystemExit("MouseFragment button listener point not found")

          s = s.replace(old, new, 1)

          marker = "    private boolean onMenuItemClick(MenuItem menuItem) {\n"

          method = (
              "    private void onAccessibilityClickButton(View v) {\n"
              "        controller.click(v.getId() == R.id.left_button);\n"
              "    }\n\n"
          )

          if marker not in s:
              raise SystemExit("MouseFragment method point not found")

          s = s.replace(marker, method + marker, 1)

          old = "        getView().requestFocus();\n"

          new = (
              "        if (leftButton != null) {\n"
              "            leftButton.post(\n"
              "                    () -> {\n"
              "                        leftButton.requestFocus();\n"
              "                        leftButton.performAccessibilityAction(\n"
              "                                AccessibilityNodeInfo.ACTION_ACCESSIBILITY_FOCUS,\n"
              "                                null);\n"
              "                    });\n"
              "        } else {\n"
              "            getView().requestFocus();\n"
              "        }\n"
          )

          if old not in s:
              raise SystemExit("MouseFragment focus point not found")

          s = s.replace(old, new, 1)
          fragment.write_text(s, encoding="utf-8")

          gradle = Path("app/build.gradle")
          s = gradle.read_text(encoding="utf-8")

          if 'ndkVersion "26.3.11579264"' not in s:
              s = s.replace(
                  "android {\n",
                  'android {\n    ndkVersion "26.3.11579264"\n',
                  1,
              )

          s = s.replace('            stl "gnustl_static"\n', "")

          cmake_path = "            path file('src/main/cpp/CMakeLists.txt')\n"

          cmake_with_version = (
              "            path file('src/main/cpp/CMakeLists.txt')\n"
              "            version '3.22.1'\n"
          )

          if "version '3.22.1'" not in s:
              if cmake_path not in s:
                  raise SystemExit("CMake path not found in app/build.gradle")

              s = s.replace(
                  cmake_path,
                  cmake_with_version,
                  1,
              )

          gradle.write_text(s, encoding="utf-8")

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wearmouse-double-pinch-apk
          path: out/*.apk
          if-no-files-found: error
